name: build-jar
# Gera o JAR do mod contra as dependencias SRG reais (RetroFuturaGradle) e publica os arquivos
# SOLTOS (sem zip) como artifacts. Compilado != testado no jogo != aprovado pelo dono.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  jar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            8
            17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Cache do workspace RFG (MC 1.7.10 decompilado/recompilado)
        uses: actions/cache@v4
        with:
          path: tools/ci/rfg-deps/build/rfg
          key: rfg-1.7.10-${{ hashFiles('tools/ci/rfg-deps/*.gradle') }}
      - name: Dependencias SRG do 1.7.10 (setupCIWorkspace)
        run: gradle -p tools/ci/rfg-deps --no-daemon setupCIWorkspace copyAcmDeps
      # API do AkashicMixer (so classpath de compilacao; nada entra no JAR). Commit fixo + SHA-256 conferido,
      # identico ao da evidencia da 0.7.0-alpha.5 (evidence/alpha5-mixer-20261102/native-classpath.json).
      - name: AkashicMixer API (JitPack, commit 0ff47b7)
        run: |
          J=tools/ci/rfg-deps/build/acm-deps/akashicmixer-0ff47b7-dev.jar
          curl -fsSL --retry 5 --retry-delay 15 --max-time 300 -o "$J" https://jitpack.io/com/github/Akashiic/AkashicMixer/0ff47b7/AkashicMixer-0ff47b7-dev.jar
          echo "56e6e80c615e3806b4b592f77a889ca11d64dc549d803688d1b3d95dcd7375d2  $J" | sha256sum -c -
      - name: deps.json
        run: python3 tools/ci/write_deps_json.py
      - name: Build do JAR (tools/build_native.py)
        run: python3 tools/build_native.py --classpath-json deps.json
      - name: SHA-256 e nome do JAR
        id: jar
        run: |
          JAR=$(ls dist/AkashicCinematicMenu-*.jar)
          sha256sum "$JAR" | sed 's#dist/##' > "$JAR.sha256"
          cat "$JAR.sha256"
          echo "path=$JAR" >> "$GITHUB_OUTPUT"
      - name: Amostras pelo codigo real (rasterizador em software)
        run: python3 tools/preview/run_natal_preview.py build/preview-natal
      # archive: false => cada arquivo e publicado solto (um arquivo por etapa; o nome do arquivo vira o nome do artifact).
      - uses: actions/upload-artifact@v7
        with: { path: '${{ steps.jar.outputs.path }}', archive: false, if-no-files-found: error }
      - uses: actions/upload-artifact@v7
        with: { path: '${{ steps.jar.outputs.path }}.sha256', archive: false, if-no-files-found: error }
      - uses: actions/upload-artifact@v7
        with: { path: evidence/native-build.json, archive: false, if-no-files-found: error }
      - uses: actions/upload-artifact@v7
        with: { path: evidence/native-classpath.json, archive: false, if-no-files-found: error }
      - uses: actions/upload-artifact@v7
        with: { path: build/preview-natal/menu-1920x1080.png, archive: false, if-no-files-found: error }
      - uses: actions/upload-artifact@v7
        with: { path: build/preview-natal/boot-1920x1080.png, archive: false, if-no-files-found: error }
      - uses: actions/upload-artifact@v7
        with: { path: build/preview-natal/transicao-1920x1080.png, archive: false, if-no-files-found: error }
      - uses: actions/upload-artifact@v7
        with: { path: build/preview-natal/secundaria-1920x1080.png, archive: false, if-no-files-found: error }
